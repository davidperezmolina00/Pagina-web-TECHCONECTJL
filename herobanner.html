<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechConectJL | Header</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --p: #6C2BD9;
            --pl: #9333EA;
            --pp: #EDE9FE;
            --dark: #111827;
            --muted: #6B7280;
            --border: #E5E7EB;
            --surface: #F9FAFB;
            --white: #ffffff;
            --r: 16px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            background: var(--surface);
            padding-top: 110px;
        }

        .hdr {
            background: var(--white);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 9999;
            padding: 8px 0 0 0;
        }

        .hdr-inner {
            max-width: 1320px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            padding: 0 20px;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            flex-shrink: 0;
        }

        .logo img {
            width: 220px;
            height: auto;
            display: block;
        }

        .searchbar {
            flex: 1;
            display: flex;
            background: var(--surface);
            border-radius: 50px;
            padding: 4px;
            border: 1px solid var(--border);
            max-width: 500px;
        }

        .searchbar input {
            flex: 1;
            border: none;
            background: transparent;
            outline: none;
            font-size: 14px;
            padding-left: 15px;
            width: 100%;
        }

        .searchbar button {
            background: var(--p);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 13px;
        }

        .cart-btn {
            background: var(--dark);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 50px;
            font-weight: 600;
            display: flex;
            gap: 8px;
            align-items: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .login-link,
        .contactar-link {
            text-decoration: none;
            color: var(--dark);
            font-size: 14px;
            font-weight: 600;
            padding: 8px 12px;
            border-radius: 50px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .login-link:hover,
        .contactar-link:hover {
            background: var(--pp);
            color: var(--p);
        }

        .nav-categories {
            display: flex;
            justify-content: center;
            gap: 30px;
            padding: 10px 0;
            margin-top: 5px;
            background: var(--white);
        }

        .nav-categories a {
            text-decoration: none;
            color: var(--muted);
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .nav-categories a:hover {
            color: var(--p);
        }

        .nav-categories a.highlight {
            color: #EF4444;
            font-weight: 700;
        }

        .hero-container {
            width: 100%;
            height: 400px;
            position: relative;
            overflow: hidden;
            background: #000;
        }

        .hero-track {
            display: flex;
            width: 100%;
            height: 100%;
            scroll-behavior: smooth;
            overflow-x: hidden;
        }

        .hero-slide {
            min-width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .hero-slide::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
        }

        .hero-content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            padding: 0 20px;
        }

        .hero-content h1 {
            font-family: 'Syne', sans-serif;
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero-content p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .hero-btn {
            background: var(--p);
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 700;
            transition: transform 0.2s;
            display: inline-block;
        }

        .hero-btn:hover {
            transform: scale(1.05);
        }

        .hero-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            z-index: 10;
            font-size: 20px;
            transition: background 0.3s;
        }

        .hero-arrow:hover {
            background: var(--p);
        }

        .hero-arrow.left {
            left: 20px;
        }

        .hero-arrow.right {
            right: 20px;
        }

        /* Responsive Hero */
        @media (max-width: 768px) {
            .hero-container {
                height: 350px;
            }

            .hero-content h1 {
                font-size: 32px;
            }

            .hero-content p {
                font-size: 14px;
            }

            .hero-arrow {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }

        @media (max-width: 600px) {
            body {
                padding-top: 160px;
            }

            .hdr-inner {
                flex-wrap: wrap;
                justify-content: space-between;
                gap: 10px;
            }

            .logo {
                order: 1;
                flex: 1;
            }

            .logo img {
                width: 170px;
            }

            .cart-btn {
                order: 2;
            }

            .login-link {
                order: 3;
            }

            .contactar-link {
                order: 4;
            }

            .searchbar {
                order: 5;
                flex: 0 0 100%;
                max-width: 100%;
                margin-top: 8px;
            }

            .nav-categories {
                gap: 15px;
                padding: 10px 10px;
                justify-content: center;
                flex-wrap: wrap;
                width: 100%;
            }
        }

        @media (max-width: 600px) {
            .logo img {
                width: 150px;
            }

            .cart-btn,
            .login-link,
            .contactar-link {
                font-size: 12px;
                padding: 6px 8px;
            }

            .nav-categories {
                gap: 10px;
                justify-content: center;
            }

            .nav-categories a {
                font-size: 12px;
            }
        }
    </style>



</head>

<body>

    <header class="hdr">
        <div class="hdr-inner">
            <a href="#" class="logo">
                <img src="logo.png" alt="TechConectJL Logo">
            </a>

            <div class="searchbar">
                <input type="search" id="searchInput" placeholder="Busca tu próximo producto...">
                <button onclick="ejecutarBusqueda()">Buscar</button>
            </div>

            <button class="cart-btn" onclick="toggleCart()">
                🛒 <span id="cartCount">0</span>
            </button>

            <a href="#" class="login-link">Iniciar Sesión</a>
            <a href="#" class="contactar-link">Contáctanos</a>
        </div>
        <nav class="nav-categories">
            <a href="#">Móviles</a>
            <a href="#">Portátiles</a>
            <a href="#">Tablets</a>
            <a href="#">Consolas</a>
            <a href="#">Accesorios</a>
            <a href="#" class="highlight">Ofertas</a>
        </nav>
    </header>
    <section class="hero-container">
        <button class="hero-arrow left" onclick="scrollHero(-1)">&#10094;</button>

        <div class="hero-track" id="heroTrack">
            <div class="hero-slide"
                style="background-image: url('https://github.com/gdelosreyes-droid/Pagina-web-TECHCONECTJL/blob/main/imagenherobanner2.png?raw=true');">
                <div class="hero-content">
                    <h1>Novedades TechConectJL</h1>
                    <p>Descubre nuestros productos de última generación.</p>
                    <a href="#" class="hero-btn">Ver ahora</a>
                </div>
            </div>
            <div class="hero-slide"
                style="background-image: url('https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1600&q=80');">
                <div class="hero-content">
                    <h1>Ofertas en Portátiles</h1>
                    <p>Equípate con lo mejor para tu trabajo o estudio.</p>
                    <a href="#" class="hero-btn">Explorar</a>
                </div>
            </div>
        </div>

        <button class="hero-arrow right" onclick="scrollHero(1)">&#10095;</button>
    </section>

</body>

</html>
